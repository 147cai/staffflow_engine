# ============================================================
# 月度工作日配置（精确值，按官方节假日安排计算）
# HR每年初根据国务院通知更新 holidays / makeup_days 后，
# 工具自动用逐日计算；下表月度数字亦同步更新以供快速查阅。
# ============================================================
monthly:
  # ── 2026年（依据国办发明电〔2025〕7号）────────────────
  2026-01: 21   # 元旦 -2天，补班+1天
  2026-02: 16   # 春节 -6天，补班+2天
  2026-03: 22   # 无假期
  2026-04: 21   # 清明 -1天
  2026-05: 19   # 劳动节 -3天，补班+1天
  2026-06: 21   # 端午 -1天
  2026-07: 23   # 无假期
  2026-08: 21   # 无假期
  2026-09: 22   # 中秋 -1天，国庆补班+1天（净=0，满22个工作日）
  2026-10: 18   # 国庆 -5天，补班+1天
  2026-11: 21   # 无假期
  2026-12: 23   # 无假期

  # ── 2027年（待官方公布后更新，当前为估算值）────────────
  2027-01: 21   # 元旦+1天假，估算（需更新）
  2027-02: 16   # 春节估算，约2月17日前后（需更新）
  2027-03: 23   # 无假期

# ============================================================
# 法定节假日（非工作日，填写后工具启用精确逐日计算）
# 说明：仅需列出本应上班、但被安排放假的工作日（周一至周五）
#       周末本身不用填（已自动跳过）
# HR每年初按最新国务院通知更新此表
# ============================================================
holidays:
  # ── 2026年 ──────────────────────────────────────────────
  # 元旦 1月1日（周四）- 1月2日（周五）放假
  - 2026-01-01
  - 2026-01-02

  # 春节 2月16日（周一）- 2月20日（周五）、2月23日（周一）放假
  - 2026-02-16
  - 2026-02-17
  - 2026-02-18
  - 2026-02-19
  - 2026-02-20
  - 2026-02-23

  # 清明节 4月6日（周一）放假
  - 2026-04-06

  # 劳动节 5月1日（周五）、5月4日（周一）、5月5日（周二）放假
  - 2026-05-01
  - 2026-05-04
  - 2026-05-05

  # 端午节 6月19日（周五）放假
  - 2026-06-19

  # 中秋节 9月25日（周五）放假
  - 2026-09-25

  # 国庆节 10月1日（周四）、2日（周五）、5日（周一）、6日（周二）、7日（周三）放假
  - 2026-10-01
  - 2026-10-02
  - 2026-10-05
  - 2026-10-06
  - 2026-10-07

# ============================================================
# 补班日（周末需要上班）
# 说明：填本应休息、但被安排上班的周六日
# ============================================================
makeup_days:
  # ── 2026年 ──────────────────────────────────────────────
  # 元旦补班：1月4日（周日）
  - 2026-01-04

  # 春节补班：2月14日（周六）、2月28日（周六）
  - 2026-02-14
  - 2026-02-28

  # 劳动节补班：5月9日（周六）
  - 2026-05-09

  # 国庆节补班：9月20日（周日）、10月10日（周六）
  - 2026-09-20
  - 2026-10-10
